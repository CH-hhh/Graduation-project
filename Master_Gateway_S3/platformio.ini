[platformio]
default_envs = esp32s3box

[env:esp32s3box]
platform = espressif32@6.9.0 
board = esp32-s3-devkitc-1 
framework = arduino
monitor_speed = 921600
; 烧录串口速率：板载 CH343P 标称最高 6Mbps，
; 5M/4M 实测会掉链子甚至卡死串口驱动，当前使用稳定的 3Mbps
upload_speed = 3000000
build_unflags = -std=gnu++11 -DCORE_DEBUG_LEVEL=1
extra_scripts = post:scripts/fix_map_path.py

; 内存与闪存设置
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L

build_flags = 
    -std=gnu++17
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0  
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_ESP_TASK_WDT_PANIC=1
    
    ; TFT 配置
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=14
    -DTFT_SCLK=13
    -DTFT_CS=12
    -DTFT_MISO=11
    -DTFT_DC=10
    -DTFT_BL=9
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=60000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git

monitor_filters = esp32_exception_decoder

[env:native]
platform = native
test_framework = unity
test_build_src = no
