<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" width="1100" height="730">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 0 5 L 10 8.5 z" fill="#64748B" />
    </marker>

    <!-- Filter for soft drop shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="730" fill="#F8FAFC" rx="16" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ========================================== -->
  <!-- 1. TOP: Cloud LLM Service                  -->
  <!-- ========================================== -->
  <g transform="translate(300, 30)" filter="url(#card-shadow)">
    <rect width="500" height="115" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Header Badge -->
    <rect x="18" y="15" width="76" height="24" rx="6" fill="#EDE9FE"/>
    <text x="56" y="32" fill="#6D28D9" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">云端服务</text>
    
    <!-- Title -->
    <text x="106" y="33" fill="#1E1B4B" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" font-weight="bold">通义千问大模型认知中枢</text>
    
    <!-- Bullets -->
    <circle cx="28" cy="62" r="3" fill="#8B5CF6"/>
    <text x="40" y="66" fill="#475569" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">Qwen-Omni 视觉与语音多模态云端理解</text>
    
    <circle cx="28" cy="88" r="3" fill="#8B5CF6"/>
    <text x="40" y="92" fill="#475569" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">Function Calling 工具调度契约与云端 TTS 语音播报</text>
  </g>

  <!-- Link 1: Cloud <-> Master Gateway S3 -->
  <line x1="550" y1="145" x2="550" y2="200" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-down)" marker-start="url(#arrow-up)"/>
  
  <!-- Label Pill -->
  <g transform="translate(460, 160)">
    <rect width="180" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="90" y="18" fill="#475569" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WiFi (HTTPS / SSE)</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. MIDDLE: Master Gateway S3 (ESP32-S3)    -->
  <!-- ========================================== -->
  <g transform="translate(60, 205)" filter="url(#card-shadow)">
    <rect width="980" height="160" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    
    <!-- Header Badge -->
    <rect x="22" y="16" width="96" height="24" rx="6" fill="#DBEAFE"/>
    <text x="70" y="33" fill="#1D4ED8" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">终端主控中枢</text>
    
    <!-- Title -->
    <text x="130" y="34" fill="#0F172A" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" font-weight="bold">ESP32-S3 桌面交互终端 (16MB Flash / 8MB PSRAM)</text>
    
    <!-- Column 1 (Left) -->
    <circle cx="32" cy="70" r="3.5" fill="#3B82F6"/>
    <text x="44" y="74" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">离线语音唤醒：16通道 Mel 滤波器 + 8阶段 DTW 模板匹配</text>
    
    <circle cx="32" cy="102" r="3.5" fill="#3B82F6"/>
    <text x="44" y="106" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">流式会话与 Skill 引擎：解析大模型 SSE 流，驱动外设联动</text>
    
    <circle cx="32" cy="134" r="3.5" fill="#3B82F6"/>
    <text x="44" y="138" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">自研轻量 C++ UI：驱动 2.8寸 ST7789 彩屏，提供 10 大功能面板</text>

    <!-- Column 2 (Right) -->
    <circle cx="530" cy="70" r="3.5" fill="#3B82F6"/>
    <text x="542" y="74" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">Native USB 桌面投屏：20+ FPS 超高速 RLE 硬件级压缩</text>
    
    <circle cx="530" cy="102" r="3.5" fill="#3B82F6"/>
    <text x="542" y="106" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">音频采集与播放：I2S INMP441 录音拾音 + NS4168 功放播报</text>
    
    <circle cx="530" cy="134" r="3.5" fill="#3B82F6"/>
    <text x="542" y="138" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">总线协调中枢：掌控 SPI DMA、UART RPC 与 ESP-NOW</text>
  </g>

  <!-- Bus Link Left: Master S3 -> STM32H743 -->
  <path d="M 290 365 L 290 475" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow-down)"/>
  
  <!-- Label Left -->
  <g transform="translate(160, 395)">
    <rect width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="130" y="20" fill="#1E293B" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">20MHz SPI DMA (音视频流)</text>
    <text x="130" y="37" fill="#64748B" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle">UART 115200 (播控与LRC歌词)</text>
  </g>

  <!-- Bus Link Right: Master S3 -> ESP32 Sensor -->
  <path d="M 810 365 L 810 475" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-down)" marker-start="url(#arrow-up)"/>
  
  <!-- Label Right -->
  <g transform="translate(685, 404)">
    <rect width="250" height="30" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="125" y="20" fill="#1E293B" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ESP-NOW (2.4GHz 无线传感网)</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. BOTTOM LEFT: STM32H743 Media Processor  -->
  <!-- ========================================== -->
  <g transform="translate(60, 480)" filter="url(#card-shadow)">
    <rect width="460" height="205" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
    
    <!-- Header Badge -->
    <rect x="20" y="16" width="94" height="24" rx="6" fill="#FFEDD5"/>
    <text x="67" y="33" fill="#C2410C" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">媒体协处理器</text>
    
    <!-- Title -->
    <text x="124" y="34" fill="#7C2D12" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" font-weight="bold">STM32H743VIT6 (480MHz Cortex-M7)</text>

    <!-- Bullets -->
    <circle cx="30" cy="66" r="3.5" fill="#F97316"/>
    <text x="42" y="70" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">OV2640 摄像头数据捕获 (DCMI 接口 + 硬件双缓冲)</text>
    
    <circle cx="30" cy="100" r="3.5" fill="#F97316"/>
    <text x="42" y="104" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">视频高速推送：20MHz SPI DMA 帧流实时推送给主控</text>
    
    <circle cx="30" cy="134" r="3.5" fill="#F97316"/>
    <text x="42" y="138" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">音频解码引擎：SD 卡 FatFS 挂载 + Helix MP3 定点解码</text>
    
    <circle cx="30" cy="168" r="3.5" fill="#F97316"/>
    <text x="42" y="172" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">歌单智能管理：两万字库拼音字母序重排 + LRC 同步</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. BOTTOM RIGHT: ESP32 Sensor Node         -->
  <!-- ========================================== -->
  <g transform="translate(580, 480)" filter="url(#card-shadow)">
    <rect width="460" height="205" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    
    <!-- Header Badge -->
    <rect x="20" y="16" width="104" height="24" rx="6" fill="#D1FAE5"/>
    <text x="72" y="33" fill="#047857" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">环境感知从节点</text>
    
    <!-- Title -->
    <text x="134" y="34" fill="#064E3B" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" font-weight="bold">ESP32 边缘环境扩展从机</text>

    <!-- Bullets -->
    <circle cx="30" cy="66" r="3.5" fill="#10B981"/>
    <text x="42" y="70" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">室内温湿度检测：DHT11 单总线数据采集</text>
    
    <circle cx="30" cy="100" r="3.5" fill="#10B981"/>
    <text x="42" y="104" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">大气压强与海拔估计：MS5611 / GY-63 高精度气压计</text>
    
    <circle cx="30" cy="134" r="3.5" fill="#10B981"/>
    <text x="42" y="138" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">室内照度检测：VEML7700 高精度环境光传感器</text>
    
    <circle cx="30" cy="168" r="3.5" fill="#10B981"/>
    <text x="42" y="172" fill="#334155" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13">智能照明控制：LEDC PWM 0%~100% 平滑无级调光</text>
  </g>
</svg>
